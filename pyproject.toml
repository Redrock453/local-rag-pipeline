[project]
name = "local-rag-pipeline"
version = "0.1.0"
description = "Local-first RAG pipeline: classify, retrieve, generate with structured outputs, validate."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
license = { text = "MIT" }

[project.optional-dependencies]
ru = ["pymorphy3>=2.0", "pymorphy3-dicts-ru"]
dev = ["pytest>=8.0"]

[project.scripts]
rag-pipeline = "rag_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
